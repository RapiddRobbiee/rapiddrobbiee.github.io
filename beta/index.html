<!doctype html>
<html lang="en" data-theme="modern">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dokkan Battle Patch Maker</title>
  <meta http-equiv="Permissions-Policy" content="identity-credentials-get=*" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <style>
    /* Premium Aesthetics Upgrade Start */
    :root {
       --glass-blur: blur(16px);
       --glass-bg: rgba(255, 255, 255, 0.05);
       --glass-border-color: rgba(255, 255, 255, 0.1);
    }
    
    html[data-theme='modern'] {
      --clr-bg-main: #020617; /* slate-950 */
      --clr-bg-card: rgba(15, 23, 42, 0.5); /* slate-900 with high transparency */
      --clr-primary: #3b82f6; 
      --clr-secondary: #06b6d4;
      --clr-accent: #60a5fa;
      --clr-text-on-primary: #ffffff;
      --clr-text: #f8fafc;
      --clr-text-muted: #94a3b8;
      --clr-text-accent: #60a5fa;
      --clr-border: rgba(148, 163, 184, 0.15);
      --clr-border-focus: var(--clr-primary);
      --clr-danger: #ef4444;
      --clr-danger-border: rgba(239, 68, 68, 0.3);
      --bg-image: 
        radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(6, 182, 212, 0.12), transparent 25%);
      --bg-opacity: 1;
      --text-shadow-accent: 0 0 16px rgba(96, 165, 250, 0.4);
      --card-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
      --glass-border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Eclipse Rebrand Theme */
    html[data-theme='eclipse'] {
      --clr-bg-main: #050000;
      --clr-bg-card: rgba(20, 0, 0, 0.4);
      --clr-primary: #ff3300;
      --clr-secondary: #ffcc00;
      --clr-accent: var(--clr-primary);
      --clr-text-on-primary: #ffffff;
      --clr-text: #ffffff;
      --clr-text-muted: #ffccaa;
      --clr-text-accent: var(--clr-secondary);
      --clr-border: rgba(100, 0, 0, 0.3);
      --clr-border-focus: var(--clr-primary);
      --clr-danger: #ff0000;
      --clr-danger-border: rgba(255, 0, 0, 0.5);
      --bg-image: radial-gradient(circle at 50% 0%, rgba(255, 51, 0, 0.2), transparent 40%);
      --bg-opacity: 1;
      --text-shadow-accent: 0 0 15px var(--clr-primary);
      --card-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.7);
      --glass-border: 1px solid rgba(255, 51, 0, 0.15);
    }

    html[data-theme='classic'] {
      --clr-bg-main: #0c0a1d;
      --clr-bg-card: rgba(17, 15, 41, 0.4);
      --clr-primary: #f97316;
      --clr-secondary: #06b6d4;
      --clr-accent: var(--clr-primary);
      --clr-text-on-primary: #ffffff;
      --clr-text: #e0e7ff;
      --clr-text-muted: #a5b4fc;
      --clr-text-accent: var(--clr-primary);
      --clr-border: rgba(139, 92, 246, 0.2);
      --clr-border-focus: var(--clr-primary);
      --clr-danger: #f43f5e;
      --clr-danger-border: rgba(244, 63, 94, 0.4);
      --bg-image: url('https://www.transparenttextures.com/patterns/stardust.png');
      --bg-opacity: 0.5;
      --text-shadow-accent: none;
    }

    html[data-theme='shenron'] {
      --clr-bg-main: #064e3b;
      --clr-bg-card: rgba(2, 44, 34, 0.4);
      --clr-primary: #eab308;
      --clr-secondary: #10b981;
      --clr-accent: var(--clr-primary);
      --clr-text-on-primary: #064e3b;
      --clr-text: #d1fae5;
      --clr-text-muted: #a7f3d0;
      --clr-text-accent: var(--clr-primary);
      --clr-border: rgba(16, 185, 129, 0.2);
      --clr-border-focus: var(--clr-primary);
      --clr-danger: #ef4444;
      --clr-danger-border: rgba(239, 68, 68, 0.4);
      --bg-image: none;
      --bg-opacity: 1;
      --text-shadow-accent: none;
    }

    html[data-theme='buu'] {
      --clr-bg-main: #581c87;
      --clr-bg-card: rgba(88, 28, 135, 0.4);
      --clr-primary: #f472b6;
      --clr-secondary: #c026d3;
      --clr-accent: var(--clr-primary);
      --clr-text-on-primary: #ffffff;
      --clr-text: #f3e8ff;
      --clr-text-muted: #e9d5ff;
      --clr-text-accent: var(--clr-primary);
      --clr-border: rgba(216, 180, 254, 0.2);
      --clr-border-focus: var(--clr-primary);
      --clr-danger: #f43f5e;
      --clr-danger-border: rgba(244, 63, 94, 0.4);
      --bg-image: none;
      --bg-opacity: 1;
      --text-shadow-accent: none;
    }

    html[data-theme='vegeta'] {
      --clr-bg-main: #1e3a8a;
      --clr-bg-card: rgba(30, 58, 138, 0.4);
      --clr-primary: #eab308;
      --clr-secondary: #ffffff;
      --clr-accent: var(--clr-primary);
      --clr-text-on-primary: #1e3a8a;
      --clr-text: #dbeafe;
      --clr-text-muted: #bfdbfe;
      --clr-text-accent: var(--clr-primary);
      --clr-border: rgba(96, 165, 250, 0.2);
      --clr-border-focus: var(--clr-primary);
      --clr-danger: #f87171;
      --clr-danger-border: rgba(248, 113, 113, 0.4);
      --bg-image: none;
      --bg-opacity: 1;
      --text-shadow-accent: none;
    }

    html[data-theme='supersaiyan'] {
      --clr-bg-main: #0c0a1d;
      --clr-bg-card: rgba(17, 15, 41, 0.4);
      --clr-primary: #2563eb;
      --clr-secondary: #facc15;
      --clr-accent: var(--clr-secondary);
      --clr-text-on-primary: #0c0a1d;
      --clr-text: #e0e7ff;
      --clr-text-muted: #a5b4fc;
      --clr-text-accent: var(--clr-secondary);
      --clr-border: rgba(250, 204, 21, 0.2);
      --clr-border-focus: var(--clr-secondary);
      --clr-danger: #f43f5e;
      --clr-danger-border: rgba(244, 63, 94, 0.4);
      --bg-image: url('https://www.transparenttextures.com/patterns/stardust.png');
      --bg-opacity: 0.5;
      --text-shadow-accent: 0 0 8px var(--clr-secondary);
    }

    html[data-theme='frieza'] {
      --clr-bg-main: #2e1041;
      --clr-bg-card: rgba(76, 29, 149, 0.4);
      --clr-primary: #a855f7;
      --clr-secondary: #ffffff;
      --clr-accent: var(--clr-primary);
      --clr-text-on-primary: #ffffff;
      --clr-text: #f3e8ff;
      --clr-text-muted: #e9d5ff;
      --clr-text-accent: var(--clr-primary);
      --clr-border: rgba(167, 139, 250, 0.2);
      --clr-border-focus: var(--clr-primary);
      --clr-danger: #f43f5e;
      --clr-danger-border: rgba(244, 63, 94, 0.4);
      --bg-image: url('https://www.transparenttextures.com/patterns/subtle-zebra-3d.png');
      --bg-opacity: 0.2;
      --text-shadow-accent: none;
    }

    html[data-theme='cell'] {
      --clr-bg-main: #14532d;
      --clr-bg-card: rgba(20, 83, 45, 0.4);
      --clr-primary: #84cc16;
      --clr-secondary: #a855f7;
      --clr-accent: var(--clr-primary);
      --clr-text-on-primary: #14532d;
      --clr-text: #dcfce7;
      --clr-text-muted: #bbf7d0;
      --clr-text-accent: var(--clr-primary);
      --clr-border: rgba(134, 239, 172, 0.2);
      --clr-border-focus: var(--clr-primary);
      --clr-danger: #f97316;
      --clr-danger-border: rgba(249, 115, 22, 0.4);
      --bg-image: url('https://www.transparenttextures.com/patterns/otis-redding.png');
      --bg-opacity: 0.3;
      --text-shadow-accent: 0 0 5px var(--clr-primary);
    }
    /* Premium Aesthetics Upgrade End */

    html[data-theme='cell'] .btn-primary {
      color: #14532d;
    }

    /* Premium Themes */
    @keyframes corruption-pan {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    html[data-theme='zamasu'] {
      --clr-bg-main: #2a0a29;
      --clr-bg-card: rgba(42, 10, 41, 0.7);
      --clr-primary: #8b5cf6;
      /* violet-500 */
      --clr-secondary: #2dd4bf;
      /* teal-400 */
      --clr-accent: var(--clr-secondary);
      --clr-text-on-primary: #ffffff;
      --clr-text: #f3e8ff;
      /* purple-100 */
      --clr-text-muted: #d8b4fe;
      /* purple-300 */
      --clr-text-accent: var(--clr-secondary);
      --clr-border: rgba(139, 92, 246, 0.4);
      --clr-border-focus: var(--clr-secondary);
      --clr-danger: #f43f5e;
      /* rose-500 */
      --clr-danger-border: rgba(244, 63, 94, 0.4);
      --bg-image: url('https://www.transparenttextures.com/patterns/gplay.png');
      --bg-opacity: 0.1;
      --text-shadow-accent: 0 0 6px var(--clr-secondary);
    }

    html[data-theme='zamasu'] .card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(45deg,
          rgba(45, 212, 191, 0.05),
          rgba(45, 212, 191, 0),
          rgba(139, 92, 246, 0.05));
      background-size: 200% 200%;
      animation: corruption-pan 15s ease infinite;
      opacity: 0.7;
    }

    @keyframes flicker-effect {

      0%,
      100% {
        border-color: var(--clr-border);
      }

      50% {
        border-color: var(--clr-border-focus);
      }
    }

    html[data-theme='blackfrieza'] {
      --clr-bg-main: #000000;
      --clr-bg-card: rgba(17, 17, 17, 0.7);
      --clr-primary: #ffffff;
      --clr-secondary: #a3a3a3;
      /* neutral-400 */
      --clr-accent: var(--clr-primary);
      --clr-text-on-primary: #000000;
      --clr-text: #fafafa;
      /* neutral-50 */
      --clr-text-muted: #d4d4d4;
      /* neutral-300 */
      --clr-text-accent: var(--clr-primary);
      --clr-border: #404040;
      /* neutral-700 */
      --clr-border-focus: #ffffff;
      --clr-danger: #e11d48;
      /* rose-600 */
      --clr-danger-border: rgba(225, 29, 72, 0.5);
      --bg-image: none;
      --bg-opacity: 1;
      --text-shadow-accent: 0 0 2px var(--clr-primary);
    }

    html[data-theme='blackfrieza'] .card,
    html[data-theme='blackfrieza'] input,
    html[data-theme='blackfrieza'] select,
    html[data-theme='blackfrieza'] textarea,
    html[data-theme='blackfrieza'] button,
    html[data-theme='blackfrieza'] .profile-dropdown,
    html[data-theme='blackfrieza'] .theme-dropdown {
      border-radius: 2px;
    }

    html[data-theme='blackfrieza'] input:focus,
    html[data-theme='blackfrieza'] select:focus,
    html[data-theme='blackfrieza'] textarea:focus {
      animation: flicker-effect 1s infinite steps(1, end);
    }

    html[data-theme='blackfrieza'] .btn-primary {
      background: var(--clr-primary);
      color: #000;
      clip-path: none;
    }

    html[data-theme='blackfrieza'] .btn-primary:hover {
      background: var(--clr-secondary);
    }

    /* Fix sidebar selected tab contrast for BlackFrieza theme */
    html[data-theme='blackfrieza'] aside nav button[class*='bg-[var(--clr-primary)]'] {
      color: #000000 !important;
    }

    /* NEW ADVANCED ANIMATED THEMES */

    /* Cosmic Rift Theme */
    @keyframes stars {
      from {
        background-position: 0 0;
      }

      to {
        background-position: -10000px 5000px;
      }
    }

    html[data-theme='cosmicrift'] {
      --clr-bg-main: #0c0a1d;
      --clr-bg-card: rgba(26, 22, 60, 0.7);
      --clr-primary: #8b5cf6;
      /* violet-500 */
      --clr-secondary: #38bdf8;
      /* sky-400 */
      --clr-accent: var(--clr-secondary);
      --clr-text-on-primary: #ffffff;
      --clr-text: #e0e7ff;
      --clr-text-muted: #a5b4fc;
      --clr-text-accent: var(--clr-secondary);
      --clr-border: rgba(139, 92, 246, 0.4);
      --clr-border-focus: var(--clr-secondary);
      --clr-danger: #f43f5e;
      --clr-danger-border: rgba(244, 63, 94, 0.4);
      --bg-image: none;
      --bg-opacity: 1;
      --text-shadow-accent: 0 0 8px var(--clr-secondary);
    }

    html[data-theme='cosmicrift'] body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: -2;
      background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
      animation: stars 200s linear infinite;
    }

    html[data-theme='cosmicrift'] .card {
      backdrop-filter: blur(16px) saturate(180%);
      border-width: 2px;
      border-image: linear-gradient(145deg, var(--clr-primary), var(--clr-secondary)) 1;
    }

    html[data-theme='cosmicrift'] .modal-card {
      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.5),
        0 0 30px var(--clr-accent);
    }

    /* Dragon Radar Theme */
    @keyframes radar-sweep {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes radar-ping {
      0% {
        transform: scale(0.1);
        opacity: 1;
      }

      80% {
        transform: scale(1.2);
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    html[data-theme='dragonradar'] {
      --clr-bg-main: #0a1809;
      --clr-bg-card: rgba(10, 24, 9, 0.8);
      --clr-primary: #f59e0b;
      /* amber-500 */
      --clr-secondary: #a3e635;
      /* lime-400 */
      --clr-accent: var(--clr-primary);
      --clr-text-on-primary: #0a1809;
      --clr-text: var(--clr-secondary);
      --clr-text-muted: #4d7c0f;
      --clr-text-accent: var(--clr-primary);
      --clr-border: rgba(163, 230, 53, 0.3);
      --clr-border-focus: var(--clr-primary);
      --clr-danger: #dc2626;
      --clr-danger-border: rgba(220, 38, 38, 0.4);
      --bg-image: none;
      --bg-opacity: 1;
      --text-shadow-accent: 0 0 6px var(--clr-primary);
      font-family: 'Roboto Mono', monospace;
    }

    html[data-theme='dragonradar'] .btn-primary {
      color: #0a1809;
    }

    html[data-theme='dragonradar'] body {
      overflow: hidden;
    }

    html[data-theme='dragonradar'] body::before {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      width: 200vw;
      height: 200vw;
      transform: translate(-50%, -50%);
      background-image:
        radial-gradient(rgba(163, 230, 53, 0.2) 1px, transparent 1px),
        radial-gradient(rgba(163, 230, 53, 0.2) 1px, transparent 1px),
        repeating-radial-gradient(circle at center,
          rgba(163, 230, 53, 0.2) 0,
          rgba(163, 230, 53, 0.2) 1px,
          transparent 1px,
          transparent 20%);
      background-size:
        50px 50px,
        50px 50px,
        100px 100px;
      background-position:
        0 0,
        25px 25px,
        0 0;
      z-index: -2;
    }

    html[data-theme='dragonradar'] body::after {
      content: '';
      position: fixed;
      top: -50vh;
      left: -50vw;
      width: 200vw;
      height: 200vh;
      background: conic-gradient(from 0deg,
          transparent 0%,
          rgba(163, 230, 53, 0.3) 10%,
          transparent 35%);
      animation: radar-sweep 5s linear infinite;
      z-index: -1;
      pointer-events: none;
    }

    html[data-theme='dragonradar'] button:active::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      border: 2px solid var(--clr-primary);
      animation: radar-ping 0.5s ease-out forwards;
    }

    /* Destroyer God Theme */
    html[data-theme='destroyer'] {
      --clr-bg-main: #1e1b2e;
      --clr-bg-card: rgba(15, 12, 32, 0.6);
      --clr-primary: #d946ef;
      --clr-secondary: #a78bfa;
      --clr-accent: var(--clr-primary);
      --clr-text-on-primary: #ffffff;
      --clr-text: #ddd6fe;
      --clr-text-muted: #a78bfa;
      --clr-text-accent: #f5d0fe;
      --clr-border: rgba(167, 139, 250, 0.4);
      --clr-border-focus: var(--clr-primary);
      --clr-danger: #be185d;
      --clr-danger-border: rgba(190, 24, 93, 0.5);
      --bg-image: none;
      --bg-opacity: 1;
      --text-shadow-accent: 0 0 10px var(--clr-primary);
    }

    html[data-theme='destroyer'] body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: -2;
      background: linear-gradient(120deg, #1e1b2e, #4c1d95, #1e1b2e);
    }

    html[data-theme='destroyer'] body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: -1;
      background-image: url('https://www.transparenttextures.com/patterns/noise-lines.png');
      opacity: 0.1;
      pointer-events: none;
    }

    html[data-theme='destroyer'] .card {
      border-radius: 4px;
      box-shadow:
        0 0 15px rgba(217, 70, 239, 0.2),
        inset 0 0 10px rgba(217, 70, 239, 0.1);
    }

    /* Crimson Theme */
    html[data-theme='crimson'] {
      --clr-bg-main: #1f0a0a;
      --clr-bg-card: rgba(42, 10, 10, 0.7);
      --clr-primary: #e11d48;
      /* rose-600 */
      --clr-secondary: #f43f5e;
      /* rose-500 */
      --clr-accent: var(--clr-primary);
      --clr-text-on-primary: #ffffff;
      --clr-text: #fee2e2;
      /* rose-50 */
      --clr-text-muted: #fca5a5;
      /* rose-300 */
      --clr-text-accent: var(--clr-secondary);
      --clr-border: rgba(244, 63, 94, 0.4);
      --clr-border-focus: var(--clr-primary);
      --clr-danger: #fb7185;
      /* rose-400 */
      --clr-danger-border: rgba(251, 113, 133, 0.5);
      --bg-image: url('https://www.transparenttextures.com/patterns/az-subtle.png');
      --bg-opacity: 0.3;
      --text-shadow-accent: 0 0 8px var(--clr-secondary);
    }

    html[data-theme='crimson'] .btn-primary {
      background: linear-gradient(45deg, #be123c, #e11d48);
      color: white;
    }

    /* Maple Theme */
    html[data-theme='maple'] {
      --clr-bg-main: #291d13;
      --clr-bg-card: rgba(67, 49, 30, 0.75);
      --clr-primary: #ea580c;
      /* orange-600 */
      --clr-secondary: #f97316;
      /* orange-500 */
      --clr-accent: var(--clr-primary);
      --clr-text-on-primary: #ffffff;
      --clr-text: #fff7ed;
      /* orange-50 */
      --clr-text-muted: #fed7aa;
      /* orange-200 */
      --clr-text-accent: var(--clr-secondary);
      --clr-border: rgba(251, 146, 60, 0.4);
      --clr-border-focus: var(--clr-secondary);
      --clr-danger: #ef4444;
      /* red-500 */
      --clr-danger-border: rgba(239, 68, 68, 0.4);
      --bg-image: url('https://www.transparenttextures.com/patterns/wood-pattern.png');
      --bg-opacity: 0.15;
      --text-shadow-accent: 0 0 6px var(--clr-secondary);
    }

    html[data-theme='maple'] .btn-primary {
      background: linear-gradient(45deg, #c2410c, #ea580c);
      color: white;
    }

    /* NEW ANIMATIONS */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes fadeInScaleUp {
      from {
        opacity: 0;
        transform: scale(0.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(20px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .animate-slide-in {
      animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-fade-in {
      animation: fadeIn 0.3s ease-out forwards;
    }

    body {
      font-family: 'Rajdhani', 'Inter', sans-serif;
      background-color: var(--clr-bg-main);
      color: var(--clr-text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-image: var(--bg-image);
      background-blend-mode: overlay;
      transition: background-color 0.5s ease;
      overflow-x: hidden;
    }

    .background-overlay {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0) 0%, var(--clr-bg-main) 100%);
      opacity: var(--bg-opacity);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 12px;
      height: 12px;
    }

    ::-webkit-scrollbar-track {
      background: var(--clr-bg-main);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--clr-border);
      border-radius: 6px;
      border: 3px solid var(--clr-bg-main);
      transition: background-color 0.2s ease;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--clr-accent);
    }

    .font-rajdhani {
      font-family: 'Rajdhani', sans-serif;
    }

    .font-roboto-mono {
      font-family: 'Roboto Mono', monospace;
    }

    /* Main Card Style */
    .card {
      background:
        radial-gradient(circle at 100% 100%,
          rgba(255, 255, 255, 0.03),
          rgba(255, 255, 255, 0) 40%),
        var(--clr-bg-card);
      border: 1px solid var(--clr-border);
      border-radius: 0.75rem;
      /* rounded-xl */
      box-shadow:
        0 4px 6px -1px rgb(0 0 0 / 0.1),
        0 2px 4px -2px rgb(0 0 0 / 0.1),
        0 0 0 1px rgba(255, 255, 255, 0.05) inset;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      backdrop-filter: blur(10px);
      position: relative;
      /* For pseudo-elements */
    }

    .card-inset {
      background-color: color-mix(in srgb, var(--clr-bg-main) 40%, var(--clr-bg-card));
      border: 1px solid var(--clr-border);
    }

    .section-title {
      position: relative;
      border-bottom: none;
      /* remove old border */
      color: var(--clr-text-accent);
    }

    .section-title::after {
      /* NEW - Gradient bottom border */
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, var(--clr-accent) 0%, transparent 80%);
    }

    /* Button and Input Styling */
    .btn-primary,
    .btn-secondary,
    .btn-danger,
    .btn-secondary-sm,
    .btn-danger-sm {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: 'Rajdhani', sans-serif;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .btn-primary:active,
    .btn-secondary:active,
    .btn-danger:active,
    .btn-secondary-sm:active,
    .btn-danger-sm:active {
      transform: scale(0.97);
    }

    .btn-primary {
      position: relative;
      background: linear-gradient(135deg, var(--clr-primary), var(--clr-accent));
      color: white;
      border: none;
      border-radius: 0.5rem;
      padding: 0.5rem 1.5rem;
      box-shadow:
        0 4px 15px rgba(0, 0, 0, 0.2),
        0 0 0 1px rgba(255, 255, 255, 0.1) inset;
      clip-path: none;
      /* Reset old clip-path */
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow:
        0 8px 25px rgba(59, 130, 246, 0.4),
        0 0 0 1px rgba(255, 255, 255, 0.2) inset;
      filter: brightness(1.1);
    }

    .btn-primary:disabled {
      filter: grayscale(80%) brightness(0.7);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-secondary {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--clr-border);
      color: var(--clr-text-muted);
      border-radius: 0.5rem;
      padding: 0.5rem 1rem;
    }

    .btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.1);
      color: var(--clr-text);
      border-color: var(--clr-text-muted);
      transform: translateY(-1px);
    }

    .btn-danger {
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--clr-danger-border);
      color: var(--clr-danger);
      border-radius: 0.5rem;
      padding: 0.5rem 1rem;
    }

    .btn-danger:hover {
      background-color: rgba(239, 68, 68, 0.2);
      border-color: var(--clr-danger);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
    }

    .btn-secondary-sm {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--clr-border);
      color: var(--clr-text-muted);
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem;
      border-radius: 0.375rem;
    }

    .btn-secondary-sm:hover {
      background-color: rgba(255, 255, 255, 0.1);
      color: var(--clr-text);
      border-color: var(--clr-text-muted);
    }

    .btn-danger-sm {
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--clr-danger-border);
      color: var(--clr-danger);
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem;
      border-radius: 0.375rem;
    }

    .btn-danger-sm:hover {
      background-color: rgba(239, 68, 68, 0.2);
      border-color: var(--clr-danger);
    }

    /* NEW Theme Button Styles */
    .theme-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.75rem;
      border-radius: 0.75rem;
      border: 1px solid var(--clr-border);
      background-color: rgba(0, 0, 0, 0.2);
      transition: all 0.2s ease-in-out;
      cursor: pointer;
    }

    .theme-button:hover {
      background-color: rgba(255, 255, 255, 0.05);
      border-color: var(--clr-primary);
      transform: translateY(-2px);
    }

    .theme-color-blotch {
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      margin-bottom: 0.5rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.1);
    }

    .theme-name-small {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--clr-text-muted);
      text-align: center;
    }

    .theme-button.selected {
      border-color: var(--clr-primary);
      background-color: rgba(59, 130, 246, 0.1);
      box-shadow: 0 0 0 1px var(--clr-primary) inset;
    }

    .theme-button.selected .theme-name-small {
      color: var(--clr-primary);
      font-weight: 600;
    }

    /* UPDATED input/select focus transition */
    input,
    select,
    textarea {
      background-color: rgba(15, 23, 42, 0.6);
      /* darker background */
      border: 1px solid var(--clr-border);
      border-radius: 0.5rem;
      color: var(--clr-text);
      padding: 0.6rem 1rem;
      transition: all 0.2s ease;
      font-size: 0.95rem;
    }

    input:focus,
    select:focus,
    textarea:focus {
      background-color: rgba(15, 23, 42, 0.8);
      border-color: var(--clr-primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
      outline: none;
    }

    input::placeholder {
      color: var(--clr-text-muted);
      opacity: 0.6;
    }

    /* Text colors for various components */
    .text-main-accent {
      color: var(--clr-text-accent);
      text-shadow: var(--text-shadow-accent);
    }

    .text-header-title {
      color: var(--clr-text);
    }

    .text-icon-primary {
      color: var(--clr-secondary);
    }

    /* MODAL STYLES */
    .modal-backdrop {
      background-color: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      animation: fadeIn 0.3s ease-out forwards;
    }

    .modal-content {
      animation: fadeInScaleUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }

    .modal-title {
      color: var(--clr-text);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.025em;
    }

    .modal-card {
      background-color: var(--clr-bg-card);
      border: 1px solid var(--clr-border);
      box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.5);
      border-radius: 1rem;
    }

    /* Skill/Category Chips */
    .skill-chip {
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.75rem;
      background-color: color-mix(in srgb, var(--clr-primary) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--clr-primary) 20%, transparent);
      color: var(--clr-text);
      border-radius: 9999px;
      /* pill shape */
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .skill-chip:hover {
      background-color: rgba(59, 130, 246, 0.2);
      border-color: var(--clr-primary);
      transform: translateY(-1px);
    }

    /* ACCORDION STYLES */
    .accordion-header {
      transition: all 0.2s ease;
      border-radius: 0.75rem;
    }

    .accordion-header:hover {
      background-color: rgba(255, 255, 255, 0.03);
    }

    .accordion-content {
      overflow: hidden;
      transition:
        max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1),
        opacity 0.3s ease-out;
      max-height: 0;
      opacity: 0;
    }

    .accordion-content.expanded {
      max-height: 5000px;
      opacity: 1;
      transition:
        max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1),
        opacity 0.4s ease-in 0.1s;
    }

    /* RESIZABLE SIDEBAR */
    .resize-handle {
      width: 6px;
      cursor: col-resize;
      background-color: transparent;
      position: absolute;
      top: 0;
      bottom: 0;
      right: -3px;
      /* Center it on the border */
      z-index: 10;
      transition: background-color 0.2s ease;
    }

    .resize-handle:hover,
    .resizing {
      background-color: var(--clr-border-focus);
    }

    /* Animations toggle */
    body.animations-disabled *,
    body.animations-disabled *::before,
    body.animations-disabled *::after {
      transition-duration: 0s !important;
      transition-delay: 0s !important;
      animation-duration: 0s !important;
      animation-delay: 0s !important;
      animation-iteration-count: 1 !important;
    }
  </style>
